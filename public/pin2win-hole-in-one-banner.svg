<svg width="1920" height="640" viewBox="0 0 1920 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1920" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1f1a"/>
      <stop offset="0.55" stop-color="#1f4f2e"/>
      <stop offset="1" stop-color="#f5efdf"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 280) rotate(144.462) scale(690 360)">
      <stop stop-color="#f6d35f" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#f6d35f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#08110e" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1920" height="640" fill="url(#field)"/>
  <rect width="1920" height="640" fill="url(#spotlight)"/>

  <path d="M0 487C222 418 426 430 637 493C846 556 1064 578 1275 513C1496 445 1702 411 1920 474V640H0V487Z" fill="#f5efdf" opacity="0.92"/>
  <path d="M0 530C249 459 491 473 741 538C1015 609 1234 575 1429 517C1599 466 1759 471 1920 523V640H0V530Z" fill="#ffffff" opacity="0.78"/>

  <g transform="translate(112 78)">
    <rect width="86" height="86" rx="18" fill="#f5efdf"/>
    <text x="43" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900" fill="#13201c">P2W</text>
    <text x="112" y="36" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Pin2Win</text>
    <text x="114" y="70" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#d9e8d2">Golf entertainment challenge</text>
  </g>

  <g transform="translate(112 190)">
    <text font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#f6d35f" letter-spacing="3">HOLE-IN-ONE CHALLENGE</text>
    <text y="96" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="950" fill="#ffffff">Win $10,000</text>
    <text y="170" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">Make a hole in one and take the prize.</text>
    <text y="238" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="950" fill="#f6d35f">$25 for 5 shots</text>
    <rect x="-2" y="266" width="894" height="50" rx="25" fill="#13201c" opacity="0.72"/>
    <text x="24" y="299" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850" fill="#ffffff">Scan the QR code onsite to create your entry and unlock challenge access.</text>
  </g>

  <g transform="translate(1376 72)" filter="url(#softShadow)">
