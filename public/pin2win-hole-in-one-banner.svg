    <text x="202" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="950" fill="#13201c">SCAN TO PLAY</text>
    <text x="202" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#59655f">Valid onsite entry required. Terms apply.</text>
  </g>
